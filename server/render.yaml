services:
  - type: web
    name: stock-ai-backend
    runtime: docker
    plan: pro
    rootDir: server
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: "3001"

  - type: cron
    name: stock-ai-health-ping
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: node scripts/healthcheck.mjs
    schedule: "*/5 * * * *"
    envVars:
      - key: HEALTH_URL
        sync: false
